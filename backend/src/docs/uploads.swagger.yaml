paths:
  /products/{id}/image:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      summary: رفع صورة المنتج (بتبدّل القديمة)
      description: JPEG أو PNG أو WebP، لحد 5 ميجا. الملف في الحقل file. النوع بيتفحص من محتوى الملف.
      tags:
        - Images
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadInput'
      responses:
        '200':
          description: اترفعت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: مفيش ملف أو الطلب غلط (FILE_REQUIRED / BAD_UPLOAD)
        '401':
          description: مش مسجّل دخول
        '404':
          description: المنتج مش موجود
        '413':
          description: الصورة أكبر من 5 ميجا (IMAGE_TOO_LARGE)
        '415':
          description: الملف مش صورة مدعومة (UNSUPPORTED_IMAGE)
        '502':
          description: فشل الرفع على Cloudinary (UPLOAD_FAILED)
        '503':
          description: مفاتيح Cloudinary مش متضبطة (UPLOADS_NOT_CONFIGURED)
    delete:
      summary: مسح صورة المنتج
      tags:
        - Images
      security:
        - BearerAuth: []
      responses:
        '204':
          description: اتمسحت (أو مكانش فيه صورة)
        '404':
          description: المنتج مش موجود

