      tags:
        - Images
      security:
        - BearerAuth: []
      responses:
        '204':
          description: اتمسح

components:
  schemas:
    ImageUploadInput:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: JPEG أو PNG أو WebP، لحد 5 ميجا

    ImageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            imageUrl:
              type: string
              example: https://res.cloudinary.com/demo/image/upload/v1700000000/bayeh/products/x1.jpg
