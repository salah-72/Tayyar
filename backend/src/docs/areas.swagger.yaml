paths:
  /areas:
    get:
      summary: قايمة البلاد (الافتراضي غير المؤرشفة)
      tags:
        - Areas
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: archived
          schema:
            type: boolean
          description: true = المؤرشفة بس
      responses:
        '200':
          description: القايمة مرتبة بـ sortOrder ثم الاسم
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      areas:
                        type: array
                        items:
                          $ref: '#/components/schemas/Area'
        '401':
          description: مش مسجّل دخول
    post:
      summary: إضافة بلد
      tags:
        - Areas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAreaInput'
      responses:
        '201':
          description: اتضافت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '400':
          description: بيانات غير صحيحة
        '409':
          description: الاسم مستخدم (AREA_NAME_TAKEN) أو فيه بلد مؤرشفة بنفس الاسم (AREA_ARCHIVED)

  /areas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      summary: بلد واحدة
      tags:
        - Areas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: البلد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '404':
          description: مش موجودة (AREA_NOT_FOUND)
    patch:
      summary: تعديل بلد (أي حقل لوحده)
      tags:
        - Areas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAreaInput'
      responses:
        '200':
          description: اتعدّلت
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '404':
          description: مش موجودة
        '409':
          description: الاسم مستخدم، أو البلد مؤرشفة
    delete:
      summary: أرشفة بلد (مفيش حذف فعلي لأن الأوردرات القديمة بتشاور عليها)
      tags:
        - Areas
      security:
        - BearerAuth: []
      responses:
        '204':
          description: اتأرشفت
        '404':
          description: مش موجودة

  /areas/{id}/restore:
    post:
      summary: استرجاع بلد مؤرشفة
      tags:
        - Areas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اترجعت وبقت نشطة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '404':
          description: مش موجودة

components:
  schemas:
    Area:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: أجا
        feeMinor:
          type: integer
          description: سعر التوصيل بالقروش
          example: 2500
        sortOrder:
          type: integer
        isActive:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true

    AreaResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            area:
              $ref: '#/components/schemas/Area'

    CreateAreaInput:
      type: object
      required:
        - name
        - feeMinor
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
          example: شنيسة
        feeMinor:
          type: integer
          minimum: 0
          example: 3000
        sortOrder:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true

    UpdateAreaInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        feeMinor:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
        isActive:
          type: boolean
