paths:
  /products:
    get:
      summary: قايمة المنتجات (الافتراضي غير المؤرشفة)
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: q
          schema:
            type: string
          description: بحث بالاسم
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: storeId
          schema:
            type: string
        - in: query
          name: saleMode
          schema:
            type: string
            enum: [UNIT, WEIGHT, PIECE_WEIGHT]
        - in: query
          name: active
          schema:
            type: boolean
          description: متاح / مش متاح
        - in: query
          name: featured
          schema:
            type: boolean
        - in: query
          name: archived
          schema:
            type: boolean
          description: true = المؤرشفة بس
      responses:
        '200':
          description: صفحة منتجات مع meta للـ pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          description: مش مسجّل دخول
    post:
      summary: إضافة منتج
      description: >
        منتج عادي: categoryId إجباري. صنف في منيو مطعم: storeId (محل نوعه RESTAURANT) من غير categoryId،
        و menuSection اختياري. الفرخة: saleMode = PIECE_WEIGHT و unit = PIECE و weightChoices.
        الفلوس بالقروش والنسب بالـ basis points.
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
      responses:
        '201':
          description: اتضاف
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: بيانات غير صحيحة
        '409':
          description: فيه منتج بنفس الاسم (PRODUCT_NAME_TAKEN)
        '422':
          description: قاعدة بيانات غير سليمة (الكود بيحدد السبب، مثلًا UNIT_MISMATCH أو WEIGHTS_REQUIRED أو OPTION_NOT_APPLICABLE)

  /products/bulk-discount:
    post:
      summary: خصم على مجموعة منتجات مرة واحدة
      description: discountKind = null يخلّيهم يورّثوا خصم القسم، و NONE يلغي الخصم خالص.
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDiscountInput'
      responses:
        '200':
          description: عدد المنتجات اللي اتعدّلت
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
        '422':
          description: خصم غير صحيح (INVALID_DISCOUNT)

  /products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      summary: منتج واحد
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: المنتج
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: مش موجود (PRODUCT_NOT_FOUND)
    patch:
      summary: تعديل منتج (أي حقل لوحده)
      description: >
        القواعد بتتراجع على الحالة النهائية. optionGroupIds بيستبدل المجموعات المربوطة كلها.
        discountKind = null أو NONE بيشيل القيمة القديمة تلقائي.
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductInput'
      responses:
        '200':
          description: اتعدّل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: مش موجود
        '409':
          description: الاسم مستخدم، أو المنتج مؤرشف (PRODUCT_ARCHIVED)
        '422':
          description: قاعدة غير سليمة
    delete:
      summary: أرشفة منتج (مفيش حذف فعلي لأن الأوردرات القديمة بتشاور عليه)
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        '204':
          description: اتأرشف
        '404':
          description: مش موجود

  /products/{id}/restore:
    post:
      summary: استرجاع منتج مؤرشف
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: اترجع وبقى متاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: مش موجود
        '409':
          description: فيه منتج شغال بنفس الاسم
        '422':
          description: القسم أو المحل بتاعه مش موجود/مؤرشف

components:
  schemas:
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: فرخة كاملة - قائم
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        storeId:
          type: string
          nullable: true
        storeName:
          type: string
          nullable: true
        storeType:
          type: string
          enum: [SUPPLIER, RESTAURANT]
          nullable: true
        menuSection:
          type: string
          nullable: true
        unit:
          type: string
          enum: [KG, PIECE, PACK, BUNCH, STRIP, BOX, INJECTION, BOTTLE, SACHET, DISH, TRAY, LITER]
        saleMode:
          type: string
          enum: [UNIT, WEIGHT, PIECE_WEIGHT]
          description: >
            UNIT = سعر الوحدة × العدد. WEIGHT = سعر الكيلو × الوزن.
            PIECE_WEIGHT = سعر الكيلو × وزن القطعة × عدد القطع (الفرخة).
        priceMinor:
          type: integer
          description: بالقروش. للوحدة، أو للكيلو لو WEIGHT / PIECE_WEIGHT
          example: 7500
        minQty:
          type: number
          example: 0.25
        qtyStep:
          type: number
          example: 0.25
        weightChoices:
          type: array
          items:
            type: number
          example: [1.5, 1.8, 2, 2.2, 2.5]
        discountKind:
          type: string
          enum: [PERCENT, FIXED, NONE]
          nullable: true
          description: null = بياخد خصم القسم. NONE = من غير خصم. PERCENT / FIXED = خصم المنتج.
        discountValue:
          type: integer
          nullable: true
          description: PERCENT → basis points (1000 = 10%)، FIXED → قروش
        isFeatured:
          type: boolean
        isActive:
          type: boolean
          description: متاح / مش متاح
        sortOrder:
          type: integer
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        optionGroups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            product:
              $ref: '#/components/schemas/Product'

    CreateProductInput:
      type: object
      required:
        - name
        - unit
        - priceMinor
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
          nullable: true
          maxLength: 500
        categoryId:
          type: string
          nullable: true
        storeId:
          type: string
          nullable: true
        menuSection:
          type: string
          nullable: true
          description: قسم جوه منيو المطعم (بيتزا، كريب)
        unit:
          type: string
          enum: [KG, PIECE, PACK, BUNCH, STRIP, BOX, INJECTION, BOTTLE, SACHET, DISH, TRAY, LITER]
        saleMode:
          type: string
          enum: [UNIT, WEIGHT, PIECE_WEIGHT]
          default: UNIT
        priceMinor:
          type: integer
          minimum: 0
        minQty:
          type: number
          default: 1
        qtyStep:
          type: number
          default: 1
        weightChoices:
          type: array
          items:
            type: number
        discountKind:
          type: string
          enum: [PERCENT, FIXED, NONE]
          nullable: true
        discountValue:
          type: integer
          nullable: true
        isFeatured:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        sortOrder:
          type: integer
          default: 0
        optionGroupIds:
          type: array
          maxItems: 10
          items:
            type: string

    UpdateProductInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        storeId:
          type: string
          nullable: true
        menuSection:
          type: string
          nullable: true
        unit:
          type: string
        saleMode:
          type: string
          enum: [UNIT, WEIGHT, PIECE_WEIGHT]
        priceMinor:
          type: integer
        minQty:
          type: number
        qtyStep:
          type: number
        weightChoices:
          type: array
          items:
            type: number
        discountKind:
          type: string
          enum: [PERCENT, FIXED, NONE]
          nullable: true
        discountValue:
          type: integer
          nullable: true
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        sortOrder:
          type: integer
        optionGroupIds:
          type: array
          items:
            type: string

    BulkDiscountInput:
      type: object
      required:
        - productIds
        - discountKind
      properties:
        productIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
        discountKind:
          type: string
          enum: [PERCENT, FIXED, NONE]
          nullable: true
        discountValue:
          type: integer
          nullable: true
