openapi: 3.0.3
info:
  title: Admin Auth API
  version: 1.0.0
  description: نظام إدارة المصادقة والصلاحيات للمشرفين (Admin Authentication & Authorization API)

servers:
  - url: http://localhost:5000/api/v1
    description: الخادم المحلي (Local Development Server)

tags:
  - name: Auth
    description: العمليات المتعلقة بالمصادقة وإدارة المشرفين

paths:
  /auth/newAdmin:
    post:
      summary: إنشاء مشرف جديد (يتطلب صلاحية مشرف حالي)
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin_user
                password:
                  type: string
                  format: password
                  example: StrongP@ss123
      responses:
        '201':
          description: تم إنشاء المشرف بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
        '401':
          description: غير مصرح (رمز الوصول مفقود أو غير صالح)
        '409':
          description: اسم المستخدم مستخدم مسبقاً

  /auth/login:
    post:
      summary: تسجيل دخول المشرف
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin_user
                password:
                  type: string
                  format: password
                  example: StrongP@ss123
      responses:
        '200':
          description: تم تسجيل الدخول بنجاح وإرسال Refresh Token في ملف تعريف الارتباط (Cookie)
          headers:
            Set-Cookie:
              description: كوكيز تحتوي على refreshToken
              schema:
                type: string
                example: refreshToken=abc123xyz; Path=/auth; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: admin_user
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVC...
        '401':
          description: اسم المستخدم أو كلمة المرور غير صحيحة
        '429':
          description: محاولات تسجيل دخول كثيرة جداً، يرجى المحاولة لاحقاً

  /auth/logout:
    post:
      summary: تسجيل الخروج (حذف Refresh Token من قاعدة البيانات والكوكيز)
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: تم تسجيل الخروج بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: logout successfully

  /auth/refresh:
    post:
      summary: تجديد رمز الوصول (Access Token) باستخدام Refresh Token
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVC...
      responses:
        '200':
          description: تم إصدار Access Token جديد بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: admin_user
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVC...
        '401':
          description: الرمز غير موجود أو منتهي الصلاحية

  /auth/me:
    get:
      summary: جلب بيانات المشرف الحالي المسجل دخوله
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: تم جلب البيانات بنجاح
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: admin_user
        '401':
          description: غير مصرح

  /auth/password:
    patch:
      summary: تحديث كلمة المرور للمشرف الحالي
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
                - passwordConfirm
              properties:
                oldPassword:
                  type: string
                  format: password
                  example: OldP@ss123
                newPassword:
                  type: string
                  format: password
                  example: NewP@ss456
                passwordConfirm:
                  type: string
                  format: password
                  example: NewP@ss456
      responses:
        '200':
          description: تم تغيير كلمة المرور بنجاح، يرجى تسجيل الدخول مرة أخرى
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: password changed successfully, please log in again
        '401':
          description: كلمة المرور القديمة خاطئة

  /auth/admins:
    get:
      summary: استعراض جميع المشرفين
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: قائمة المشرفين
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      admins:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            username:
                              type: string
                              example: admin_user

  /auth/{adminId}:
    delete:
      summary: حذف مشرف معين (مع التحقق ألا يكون هو المشرف الوحيد)
      tags: [Auth]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: adminId
          required: true
          schema:
            type: integer
          description: الرقم المعرف للمشرف المراد حذفه
      responses:
        '204':
          description: تم الحذف بنجاح (بدون محتوى)
        '400':
          description: خطأ (مثل أنك المشرف الوحيد المتبقي في النظام)
        '401':
          description: غير مصرح

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: أدخل رمز الوصول (Access Token) المسبوق بكلمة Bearer هكذا -> Bearer <token>
