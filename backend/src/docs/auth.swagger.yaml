openapi: 3.0.0
info:
  title: Agricultural Store API - Authentication & Admin Module
  version: 1.0.0
  description: Secure JWT Authentication, Cookie-Based Session Management, and Admin Management API Documentation.

paths:
  /auth/login:
    post:
      summary: Admin Login (Generates Access Token & Sets HttpOnly Refresh Token Cookie)
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful, access token returned and refresh cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc123xyz...; Path=/auth; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: 'success'
                  user:
                    $ref: '#/components/schemas/AdminResponse'
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Invalid username or password

  /auth/logout:
    post:
      summary: Admin Logout (Revokes Refresh Token & Clears Cookie)
      tags:
        - Authentication
      responses:
        '200':
          description: Logged out successfully, refresh cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
                    example: 'logout successfully'

  /auth/refresh:
    post:
      summary: Refresh Access Token Using Stored Refresh Token Cookie or Body
      tags:
        - Authentication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional fallback refresh token in request body if cookies are restricted
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: 'success'
                  user:
                    $ref: '#/components/schemas/AdminResponse'
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Refresh token missing, expired, or invalid

  /auth/me:
    get:
      summary: Get Currently Authenticated Admin Profile
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: 'success'
                  user:
                    $ref: '#/components/schemas/AdminResponse'
        '401':
          description: Unauthorized (Token missing or invalid)

  /auth/password:
    patch:
      summary: Update Admin Password (Revokes All Active Refresh Sessions)
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordInput'
      responses:
        '200':
          description: Password updated successfully, sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
                    example: 'password changed successfully, please log in again'
        '401':
          description: Unauthorized or incorrect old password

  /auth/admins:
    get:
      summary: List All System Admins
      tags:
        - Admins Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admins retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: 'success'
                  data:
                    type: object
                    properties:
                      admins:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminResponse'
        '401':
          description: Unauthorized

    post:
      summary: Create New Admin Account
      tags:
        - Admins Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminInput'
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: 'success'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: Username is already in use

  /auth/admins/{adminId}:
    delete:
      summary: Delete Admin Account by ID
      tags:
        - Admins Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: adminId
          required: true
          schema:
            type: integer
            minimum: 1
          description: Target Admin ID to delete
      responses:
        '204':
          description: Admin deleted successfully (No Content)
        '401':
          description: Unauthorized
        '404':
          description: Admin not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: 'admin'
        password:
          type: string
          example: 'SecureP@ss123'

    CreateAdminInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          example: 'warehouse_manager'
        password:
          type: string
          minLength: 6
          example: 'StrongPassword!2026'

    UpdatePasswordInput:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          example: 'SecureP@ss123'
        newPassword:
          type: string
          minLength: 6
          example: 'NewSecurePassword!2026'

    AdminResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: 'admin'
